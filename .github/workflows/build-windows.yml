# Builds PerDev from source on GitHub's free Windows runners: VS Code's source,
# VSCodium's build scripts (telemetry removed, Open VSX marketplace), PerDev's
# branding and built-in AI extension. Produces the installer and portable zip
# as a downloadable artifact. Run it from the Actions tab ("Run workflow").
#
# To move to a newer VS Code: change VSCODIUM_TAG to a newer VSCodium release tag.

name: Build PerDev for Windows

on:
  workflow_dispatch:

env:
  VSCODIUM_TAG: 1.143.17183
  APP_NAME: PerDev
  BINARY_NAME: perdev
  GH_REPO_PATH: ${{ github.repository }}
  ASSETS_REPOSITORY: ${{ github.repository }}
  ORG_NAME: ${{ github.repository_owner }}
  OS_NAME: windows
  VSCODE_QUALITY: stable
  VSCODE_ARCH: x64
  DISABLE_UPDATE: 'yes'
  SHOULD_BUILD_REH: 'no'
  SHOULD_BUILD_REH_WEB: 'no'
  # The repo's .npmrc puts npm's cache on E: for local work; runners have no E:.
  npm_config_cache: C:\npm-cache

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ env.MS_COMMIT }}
      MS_TAG: ${{ env.MS_TAG }}
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
    steps:
      - name: Check out PerDev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out VSCodium build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VSCodium/vscodium
          ref: ${{ env.VSCODIUM_TAG }}
          path: vscodium
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: vscodium/.nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Build the PerDev AI extension
        run: |
          npm ci
          npm run compile
          node scripts/export-format.js

      - name: Apply PerDev branding
        run: |
          node scripts/brand-fork.js vscodium
          python -m pip install --quiet pillow
          python scripts/make_icons.py --inno vscodium/src/stable/resources/win32

      - name: Clone VS Code source
        working-directory: vscodium
        run: ./get_repo.sh

      - name: Compile
        working-directory: vscodium
        env:
          SHOULD_BUILD: 'yes'
        run: ./build.sh

      - name: Compress compiled source
        working-directory: vscodium
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - name: Upload compiled source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode
          path: vscodium/vscode.tar.gz
          retention-days: 1

  package:
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ needs.compile.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.compile.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.compile.outputs.RELEASE_VERSION }}
      npm_config_arch: x64
      npm_config_target_arch: x64
    steps:
      - name: Check out PerDev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out VSCodium build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VSCodium/vscodium
          ref: ${{ env.VSCODIUM_TAG }}
          path: vscodium
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: vscodium/.nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Re-apply installer branding
        run: |
          npm ci
          npm run compile
          node scripts/brand-fork.js vscodium
          python -m pip install --quiet pillow
          python scripts/make_icons.py --inno vscodium/src/stable/resources/win32

      - name: Download compiled source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode
          path: vscodium

      - name: Package
        working-directory: vscodium
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/windows/package.sh

      - name: Create installer and zip
        working-directory: vscodium
        run: ./prepare_assets.sh

      - name: Upload PerDev for Windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PerDev-windows-x64
          path: vscodium/assets/
          retention-days: 14
